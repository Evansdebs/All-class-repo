[build]
  publish = "public"
  command = "node -e \"const fs=require('fs'); if(!fs.existsSync('public')) fs.mkdirSync('public'); const files=fs.readdirSync('.').filter(f=>/\\.(html|htm|svg|png|jpg|jpeg|ico|json|css|js|woff2|ttf|map)$/.test(f)); files.forEach(f=>{ try{ fs.copyFileSync(f, 'public/'+f); }catch(e){} }); console.log('Build complete - public assets synced:', files.length);\""

# API rewrites for static hosting
[[redirects]]
  from = "/api/db"
  to = "/database.json"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/metadata.json"
  status = 200

# Clean URLs and Portal navigation
[[redirects]]
  from = "/"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/teacher"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/student.html"
  status = 200

[[redirects]]
  from = "/alumni"
  to = "/alumni.html"
  status = 200

[[redirects]]
  from = "/excel"
  to = "/excel.html"
  status = 200

[[redirects]]
