<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saving to Downloads</title>
    <style>
        body { font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #fff; }
        .box { max-width: 420px; padding: 28px; text-align: center; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        a.btn { display: inline-block; margin-top: 16px; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 10px; }
        iframe { width: 0; height: 0; border: 0; position: absolute; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Saving to your Downloads folder</h1>
        <p id="status">Starting download…</p>
        <a class="btn" id="saveBtn" href="#" download>Save file</a>
    </div>
    <iframe id="frame" title="download"></iframe>
    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            var url = p.get('u') || p.get('url') || '';
            var name = p.get('n') || p.get('name') || 'download';
            var status = document.getElementById('status');
            var btn = document.getElementById('saveBtn');
            var frame = document.getElementById('frame');
            if (!url) { status.textContent = 'Missing file.'; return; }
            btn.href = url;
            btn.setAttribute('target', '_top');
            btn.textContent = 'Save ' + name;
            status.textContent = 'Tap Save file. If nothing happens, press and hold and choose Save link as…';
            try { location.replace(url); } catch (e) {}
        })();
    </script>
</body>
</html>
