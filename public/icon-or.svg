<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.85"/>
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.25" stroke-dasharray="8 8"/>
  
  <!-- Central Stylized OR Monogram -->
  <g font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <!-- Main OR Text -->
    <text x="256" y="260" font-size="210" fill="url(#textGrad)" letter-spacing="-8" font-style="normal">OR</text>
  </g>
  
  <!-- Accent Academic Sparkle / Star in top-right corner of monogram -->
  <g transform="translate(372, 140) scale(0.9)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>
  
  <!-- Sleek Underline Bar -->
  <rect x="140" y="380" width="232" height="12" rx="6" fill="url(#borderGrad)"/>
</svg>
