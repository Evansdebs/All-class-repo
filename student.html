<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OneReal School Management — Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="font-awesome.css">
    <link rel="stylesheet" href="student.css?v=m1">
</head>
<body class="student-portal-body">

    <!-- ════ STUDENT AUTH OVERLAY ════ -->
    <div id="studentAuthOverlay" class="student-auth-overlay">
        <div class="student-auth-card">
            <div class="student-avatar-icon">
                <i class="fas fa-user-graduate"></i>
            </div>
            <h2>Student & Parent Portal</h2>
            <p>Enter your Admission Number to view your academic report</p>
            <div class="form-group-student">
                <label>Admission Number / Student ID *</label>
                <input type="text" id="studentLoginId" placeholder="e.g. TLS/2026/001" class="student-input" autocomplete="username">
            </div>
            <div class="form-group-student">
                <label>Date of Birth / PIN (Optional)</label>
                <div style="position:relative;">
                    <input type="password" id="studentLoginPin" placeholder="YYYY-MM-DD or PIN" class="student-input"
                        style="padding-right:42px;"
                        onkeydown="if(event.key==='Enter') handleStudentLogin()">
                    <button type="button"
                        onclick="togglePasswordVisibility('studentLoginPin', 'studentPinToggleIcon')"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:14px;padding:4px;"
                        title="Toggle visibility">
                        <i class="fas fa-eye" id="studentPinToggleIcon"></i>
                    </button>
                </div>
            </div>
            <div id="studentAuthError" style="display:none;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;text-align:left;"></div>
            <button id="studentLoginBtn" class="btn-student-login" onclick="handleStudentLogin()">
                <i class="fas fa-sign-in-alt"></i> Access Report
            </button>
            <div style="margin-top:20px;">
                <a href="/excel.html" style="color:rgba(255,255,255,.7);font-size:13px;text-decoration:none;display:block;margin-bottom:8px;">
                    <i class="fas fa-file-excel"></i> Excel templates — no login
                </a>
                <a href="/report.html" style="color:rgba(255,255,255,.4);font-size:12.5px;text-decoration:none;">
                    <i class="fas fa-chalkboard-teacher"></i> Teacher Sign In
                </a>
            </div>
        </div>
    </div>

    <!-- ════ MAIN STUDENT DASHBOARD ════ -->
    <header class="student-header">
        <div class="student-brand">
            <div id="studentSchoolLogo"><i class="fas fa-school" style="font-size:24px;color:#818cf8;"></i></div>
            <div>
                <h1 id="studentSchoolName">The Living Spring School</h1>
                <p id="studentPortalTitle">Student & Parent Performance Dashboard</p>
            </div>
        </div>
        <div class="student-user-info">
            <span id="studentDisplayTag" style="font-size:14px;font-weight:600;color:#fff;"></span>
            <button class="btn-student-logout" onclick="handleStudentLogout()">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </div>
    </header>

    <main class="student-container" id="studentMainContent" style="display:none;max-width:920px;margin:0 auto;padding:20px 16px;">

        <!-- Action Bar -->
        <div class="student-action-bar" style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px;background:#1e293b;padding:14px 18px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);">
            <div style="color:#fff;font-weight:700;font-size:15px;">
                <i class="fas fa-file-alt" style="color:#818cf8;margin-right:8px;"></i> Official Academic Report Sheet
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn-student-action primary" onclick="downloadStudentReportFile()" style="background:#4f46e5;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </button>
                <button class="btn-student-action" onclick="printStudentReportSheet()" style="background:#4338ca;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                    <i class="fas fa-print"></i> Print Report Sheet
                </button>
            </div>
        </div>

        <!-- Student Results Summary KPI Cards -->
        <div id="studentResultsSummaryCards" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin-bottom:20px;"></div>

        <!-- Official Report Card Container (Identical to Admin & Teacher Layout) -->
        <div id="studentReportCardContainer" style="margin-bottom:30px;"></div>

    </main>

    <!-- Firebase & Utility Scripts -->
    <script src="vendor/firebase-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    <script src="seed-data.js?v=prod1"></script>
    <script src="firebase-config.js?v=fb10"></script>
    <script src="files.js?v=dl9"></script>
    <script src="attendance.js?v=hub4"></script>
    <script src="student.js?v=dl9"></script>
</body>
</html>
